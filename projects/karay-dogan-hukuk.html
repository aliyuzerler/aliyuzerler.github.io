<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karay & Doğan Hukuk Bürosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --paper:#F3EEE3; --paper2:#EFE9DB; --card:#FBF8F0;
    --ink:#191712; --ink2:#6A6455;
    --seal:#7E2A21; --seal-lt:#C4705F;
    --line:rgba(25,23,18,.16); --line-lt:rgba(243,238,227,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--seal);color:var(--paper)}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:var(--paper)}
  ::-webkit-scrollbar-thumb{background:rgba(25,23,18,.28);border:2px solid var(--paper)}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;background:none;border:0;color:inherit}
  a{color:inherit}
  i[data-lucide]{display:inline-block}
  .wrap{width:min(1280px,92%);margin-inline:auto}
  em{font-style:italic}

  /* ---------- ortak tipografi & butonlar ---------- */
  .kick{font:600 11px/1 'Instrument Sans';letter-spacing:.26em;text-transform:uppercase;color:var(--seal);display:flex;align-items:center;gap:12px}
  .kick::before{content:'';width:26px;height:1px;background:var(--seal)}
  .kick.light{color:var(--seal-lt)}
  .kick.light::before{background:var(--seal-lt)}
  h2{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(30px,4.2vw,52px);line-height:1.08;letter-spacing:-.02em;margin-top:18px}
  h2 em,.hero-h em{color:var(--seal)}
  .lead{color:var(--ink2);font-size:17px;line-height:1.7;max-width:46ch}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font:600 14px 'Instrument Sans';letter-spacing:.02em;transition:.3s;text-decoration:none}
  .btn:hover{background:var(--seal);border-color:var(--seal);transform:translateY(-2px)}
  .btn.line{background:transparent;color:var(--ink)}
  .btn.line:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn.paper{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .btn.paper:hover{background:var(--seal);color:var(--paper);border-color:var(--seal)}
  .btn.full{width:100%;justify-content:center}
  .btn svg{width:16px;height:16px}

  /* ---------- reveal & scroll animasyonları ---------- */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.6,.2,1);transition-delay:calc(var(--d,0)*110ms)}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

  /* ---------- nav ---------- */
  .site-nav{position:sticky;top:0;z-index:60;background:rgba(243,238,227,.88);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
  .site-nav.scrolled{border-color:var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:74px;gap:24px}
  .brand{display:flex;align-items:baseline;gap:12px;text-decoration:none}
  .brand-mono{font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--seal)}
  .brand-name{font:600 12px 'Instrument Sans';letter-spacing:.14em;text-transform:uppercase}
  .nav-links{display:flex;gap:34px}
  .nav-links button{font:500 14px 'Instrument Sans';position:relative;padding:4px 0}
  .nav-links button::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--seal);transition:width .3s}
  .nav-links button:hover::after{width:100%}
  .nav-right{display:flex;align-items:center;gap:8px}
  .nav-admin{display:inline-flex;align-items:center;gap:7px;font:500 12px 'Instrument Sans';letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-decoration:none;padding:8px 12px;border:1px solid var(--line);transition:.3s}
  .nav-admin:hover{color:var(--paper);background:var(--ink);border-color:var(--ink)}
  .nav-admin svg{width:13px;height:13px}
  .burger{display:none;width:40px;height:40px;align-items:center;justify-content:center}
  .burger svg{width:22px;height:22px}
  .nav-menu{display:none;position:absolute;top:100%;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--line);flex-direction:column}
  .nav-menu.open{display:flex}
  .nav-menu button{text-align:left;padding:16px clamp(20px,4vw,48px);font:500 16px 'Instrument Sans';border-top:1px solid var(--line)}

  /* ---------- hero ---------- */
  .hero{padding:clamp(40px,6vh,72px) 0 0;min-height:calc(100svh - 74px);display:flex;align-items:center}
  .hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(24px,4vw,64px);align-items:center;width:100%}
  .hero-h{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(46px,6.6vw,94px);line-height:1.02;letter-spacing:-.025em;margin:26px 0 28px}
  .hero-sub{color:var(--ink2);font-size:17px;line-height:1.75;max-width:48ch}
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px}
  .hero-meta{display:flex;align-items:flex-end;gap:clamp(24px,4vw,56px);border-top:1px solid var(--line);margin-top:56px;padding-top:22px;flex-wrap:wrap}
  .hero-meta>div span{display:block;font:600 10px 'Instrument Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-bottom:7px}
  .hero-meta>div b{font:500 15px 'Fraunces',serif}
  .scrollhint{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
  .scrollhint span{font:600 10px 'Instrument Sans';letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
  .scrollhint i{width:1px;height:44px;background:var(--line);position:relative;overflow:hidden}
  .scrollhint i::after{content:'';position:absolute;left:0;top:-30%;width:1px;height:30%;background:var(--seal);animation:drip 1.8s ease-in-out infinite}
  @keyframes drip{to{top:110%}}
  .hero-visual{justify-self:center;width:min(44vw,520px)}
  .scale-cap{margin-top:14px;text-align:center;font:italic 400 14px 'Fraunces',serif;color:var(--ink2)}
  .hero-photo{position:relative}
  .hero-photo img{aspect-ratio:4/5;object-fit:cover;filter:grayscale(.3) contrast(1.03)}
  .hero-photo figcaption{margin-top:12px;font:italic 400 14px 'Fraunces',serif;color:var(--ink2)}

  /* terazi çizimi */
  .scale-wrap svg{width:100%;height:auto;overflow:visible}
  .scale-wrap .d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.55,0,.25,1) forwards;animation-delay:calc(var(--i)*110ms + .25s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  #beam,#pL,#pR{transform-box:view-box;will-change:transform}
  #beam{transform-origin:210px 64px}
  #pL{transform-origin:70px 64px}
  #pR{transform-origin:350px 64px}

  /* ---------- bölümler ---------- */
  .sec{border-top:1px solid var(--line);padding:clamp(76px,11vh,130px) 0}
  .sec.dark{background:var(--ink);color:var(--paper)}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(40px,6vh,64px)}

  /* hakkımızda */
  .about-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(32px,6vw,96px);align-items:start}
  .stats{margin-top:44px}
  .stat{border-top:1px solid var(--line);padding:20px 0}
  .stat b{display:block;font:500 clamp(38px,4.5vw,58px)/1 'Fraunces',serif}
  .stat b sup{font-size:.45em;color:var(--seal);top:-.7em;position:relative}
  .stat span{font:500 12px 'Instrument Sans';letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
  .about-fig{position:relative;margin-bottom:32px}
  .about-fig img{aspect-ratio:5/6;object-fit:cover;filter:grayscale(.25) contrast(1.02)}
  .about-fig::after{content:'';position:absolute;top:20px;left:20px;right:-20px;bottom:-20px;border:1px solid var(--seal);pointer-events:none}
  .about-txt p{color:var(--ink2);font-size:16.5px;line-height:1.85;margin-bottom:22px;max-width:58ch}
  .about-txt p:first-of-type{color:var(--ink)}

  /* uzmanlık accordion */
  .acc{border-top:1px solid var(--line)}
  .acc:last-child{border-bottom:1px solid var(--line)}
  .acc-head{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:16px;padding:26px 0;cursor:pointer;width:100%;text-align:left}
  .acc-num{font:500 15px 'Fraunces',serif;color:var(--seal)}
  .acc-title{font:500 clamp(22px,3vw,36px)/1.15 'Fraunces',serif;letter-spacing:-.01em;transition:transform .35s,color .35s}
  .acc-head:hover .acc-title{transform:translateX(10px);color:var(--seal)}
  .acc-head svg{width:20px;height:20px;color:var(--ink2);transition:transform .4s}
  .acc.open .acc-head svg{transform:rotate(180deg)}
  .acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.4,0,.2,1)}
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden}
  .acc-inner p{padding:0 0 30px 86px;max-width:640px;color:var(--ink2);font-size:16px;line-height:1.8}

  /* ekip */
  .strip-nav{display:flex;gap:10px}
  .ibtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);transition:.25s;border-radius:2px}
  .ibtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ibtn.danger:hover{background:var(--seal);border-color:var(--seal)}
  .ibtn svg{width:15px;height:15px}
  .ibtn.big{width:46px;height:46px}
  .team-strip{display:flex;gap:clamp(16px,2.4vw,32px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px;scrollbar-width:none}
  .team-strip::-webkit-scrollbar{display:none}
  .t-card{flex:0 0 min(300px,74vw);scroll-snap-align:start}
  .t-photo{overflow:hidden;margin-bottom:18px}
  .t-photo img{aspect-ratio:3/4;width:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .6s,transform .8s}
  .t-card:hover .t-photo img{filter:grayscale(0);transform:scale(1.035)}
  .t-card h3{font:500 24px 'Fraunces',serif;margin-bottom:5px}
  .t-role{font:600 11px 'Instrument Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--seal)}
  .t-focus{margin-top:9px;color:var(--ink2);font-size:14px;line-height:1.6}

  /* süreç */
  .proc-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(32px,6vw,96px);align-items:start}
  .proc-left{position:sticky;top:110px}
  .proc-left .lead{margin-top:24px}
  .step{display:grid;grid-template-columns:76px 1fr;gap:20px;padding:30px 0;border-top:1px solid var(--line)}
  .step:last-child{border-bottom:1px solid var(--line)}
  .step-num{font:500 26px 'Fraunces',serif;color:var(--seal)}
  .step h3{font:500 21px 'Fraunces',serif;margin-bottom:8px}
  .step p{color:var(--ink2);font-size:15px;line-height:1.75;max-width:52ch}

  /* referanslar (koyu) */
  .t-stage{display:grid;min-height:190px}
  .t-slide{grid-area:1/1;opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s;pointer-events:none}
  .t-slide.on{opacity:1;transform:none;pointer-events:auto}
  .t-slide blockquote{font:400 clamp(23px,3.2vw,38px)/1.35 'Fraunces',serif;max-width:22ch;letter-spacing:-.01em}
  .t-slide figcaption{margin-top:28px;display:flex;flex-direction:column;gap:4px}
  .t-slide figcaption b{font:600 14px 'Instrument Sans'}
  .t-slide figcaption span{font:400 13px 'Instrument Sans';color:#B7B0A0}
  .t-dots{display:flex;gap:10px;margin-top:40px}
  .t-dots button{width:28px;height:2px;background:var(--line-lt);transition:.3s}
  .t-dots button.on{background:var(--seal-lt)}

  /* iletişim */
  .contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,6vw,96px)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  .c-form .field{margin-bottom:26px}
  .c-form label{display:block;font:600 11px 'Instrument Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
  .c-form input,.c-form textarea,.c-form select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;font:400 16px 'Instrument Sans';color:var(--ink);border-radius:0;transition:border-color .3s}
  .c-form input:focus,.c-form textarea:focus,.c-form select:focus{outline:none;border-bottom-color:var(--ink)}
  .c-form textarea{resize:vertical;line-height:1.6}
  .form-note{margin-top:18px;font:italic 400 13.5px 'Fraunces',serif;color:var(--ink2)}
  .info-row{display:flex;gap:16px;align-items:flex-start;padding:22px 0;border-top:1px solid var(--line)}
  .info-row svg{width:19px;height:19px;color:var(--seal);flex:none;margin-top:2px}
  .info-row span{display:block;font:600 10.5px 'Instrument Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
  .info-row p{font:500 15.5px 'Fraunces',serif;line-height:1.55;max-width:34ch}
  .c-info{padding-top:8px}

  /* footer */
  .footer{background:var(--ink);color:var(--paper);padding:clamp(70px,10vh,110px) 0 0}
  .f-cta h2{color:var(--paper)}
  .f-cta .btn{margin-top:34px}
  .f-grid{display:grid;grid-template-columns:1.3fr .8fr 1fr;gap:40px;border-top:1px solid var(--line-lt);margin-top:64px;padding:52px 0}
  .f-brand{font:600 clamp(44px,5vw,68px)/1 'Fraunces',serif;color:var(--seal-lt)}
  .f-name{margin-top:12px;font:500 13px 'Instrument Sans';letter-spacing:.1em;text-transform:uppercase;color:#B7B0A0}
  .f-col h4{font:600 11px 'Instrument Sans';letter-spacing:.22em;text-transform:uppercase;color:#8F8877;margin-bottom:18px}
  .f-col a,.f-col button{display:block;text-align:left;color:#D9D3C4;text-decoration:none;font-size:15px;padding:5px 0;transition:color .25s}
  .f-col a:hover,.f-col button:hover{color:var(--seal-lt)}
  .f-col p{color:#B7B0A0;font-size:14.5px;line-height:1.8}
  .f-bot{border-top:1px solid var(--line-lt);padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .f-bot span{font-size:13px;color:#8F8877}
  .f-admin{display:inline-flex;align-items:center;gap:8px;font:500 12px 'Instrument Sans';letter-spacing:.1em;text-transform:uppercase;color:#B7B0A0;text-decoration:none;transition:color .25s}
  .f-admin:hover{color:var(--paper)}
  .f-admin svg{width:13px;height:13px}

  /* ---------- admin ---------- */
  .adm{display:grid;grid-template-columns:262px 1fr;min-height:100vh;background:var(--paper2)}
  .adm-side{background:var(--ink);color:var(--paper);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .adm-brand{padding:26px 22px;border-bottom:1px solid var(--line-lt)}
  .adm-brand .mono{display:block;font:600 26px 'Fraunces',serif;color:var(--seal-lt)}
  .adm-brand span:last-child{font:600 10.5px 'Instrument Sans';letter-spacing:.24em;text-transform:uppercase;color:#8F8877}
  .adm-menu{padding:16px 0;flex:1;overflow-y:auto}
  .adm-menu button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 22px;font:500 14px 'Instrument Sans';color:#B7B0A0;border-left:2px solid transparent;transition:.25s}
  .adm-menu button:hover{color:var(--paper)}
  .adm-menu button.on{color:var(--paper);border-left-color:var(--seal-lt);background:rgba(243,238,227,.05)}
  .adm-menu button svg{width:16px;height:16px}
  .badge{margin-left:auto;background:var(--seal);color:var(--paper);font:600 11px 'Instrument Sans';min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
  .adm-side-foot{border-top:1px solid var(--line-lt);padding:14px 0}
  .adm-slink{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 22px;font:500 13.5px 'Instrument Sans';color:#B7B0A0;text-decoration:none;transition:.25s}
  .adm-slink:hover{color:var(--paper)}
  .adm-slink svg{width:15px;height:15px}
  .adm-main{padding:0 clamp(20px,4vw,56px) 70px}
  .adm-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .adm-top h1{font:500 30px 'Fraunces',serif;letter-spacing:-.01em}
  .save-state{display:flex;align-items:center;gap:9px;font:500 12.5px 'Instrument Sans';color:var(--ink2)}
  .save-state .dot{width:8px;height:8px;border-radius:50%;background:#5E7D4C;transition:.3s}
  .save-state.busy .dot{background:var(--seal);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .adm-body{max-width:860px;padding-top:34px}
  .adm-note{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:2px solid var(--seal);padding:14px 16px;font-size:13.5px;color:var(--ink2);line-height:1.6;margin-bottom:26px}
  .adm-note svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--seal)}

  .field{margin-bottom:22px}
  .field label{display:block;font:600 10.5px 'Instrument Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
  .field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font:400 14.5px 'Instrument Sans';color:var(--ink);transition:border-color .25s}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
  .field textarea{resize:vertical;line-height:1.65}
  .abtn{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;background:var(--ink);color:var(--paper);font:600 13px 'Instrument Sans';border:1px solid var(--ink);transition:.25s;border-radius:2px}
  .abtn:hover{background:var(--seal);border-color:var(--seal)}
  .abtn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .abtn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .abtn.ghost.danger{color:var(--seal)}
  .abtn.ghost.danger:hover{background:var(--seal);color:var(--paper);border-color:var(--seal)}
  .abtn svg{width:15px;height:15px}
  .litem{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px;margin-bottom:14px}
  .lit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .lit-idx{font:500 15px 'Fraunces',serif;color:var(--seal)}
  .lit-acts{display:flex;gap:6px}
  .imgrow{display:flex;gap:16px;align-items:flex-start}
  .imgprev{width:96px;height:96px;flex:none;border:1px solid var(--line);background:var(--paper2);display:grid;place-items:center;overflow:hidden;border-radius:2px}
  .imgprev img{width:100%;height:100%;object-fit:cover}
  .imgph svg{width:22px;height:22px;color:var(--ink2)}
  .imgctl{flex:1;display:flex;flex-direction:column;gap:9px}
  .statrow{display:grid;grid-template-columns:1fr 84px 1.6fr;gap:12px;margin-bottom:14px}
  .statrow .field{margin:0}
  .list-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
  .list-top p{font-size:13.5px;color:var(--ink2)}

  /* mesajlar */
  .msg{background:var(--card);border:1px solid var(--line);border-radius:2px;margin-bottom:12px;border-left:3px solid transparent}
  .msg.unread{border-left-color:var(--seal)}
  .msg-row{display:flex;justify-content:space-between;gap:14px;padding:16px 18px;cursor:pointer;align-items:baseline;flex-wrap:wrap}
  .msg-row b{font:600 14.5px 'Instrument Sans'}
  .msg-mail{color:var(--ink2);font-size:13px;margin-left:10px}
  .msg-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
  .pill{background:var(--seal);color:var(--paper);font:600 10px 'Instrument Sans';letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:10px}
  .msg-sub{padding:0 18px 14px;font:italic 400 14.5px 'Fraunces',serif;color:var(--ink2)}
  .msg-body{display:none;padding:4px 18px 18px;border-top:1px dashed var(--line)}
  .msg.open .msg-body{display:block}

/* ---------- site etkileşimleri ---------- */
let revealIO = null, cntIO = null, tIdx = 0;

function bindSite(){
  /* görünüm animasyonları */
  if (revealIO) revealIO.disconnect();
  revealIO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('in'); revealIO.unobserve(e.target); }
  }), { threshold:.12 });
  $$('.reveal').forEach(el => revealIO.observe(el));

  /* sayaçlar */
  if (cntIO) cntIO.disconnect();
  cntIO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ animCount(e.target); cntIO.unobserve(e.target); }
  }), { threshold:.5 });
  $$('.cnt').forEach(el => cntIO.observe(el));

  /* terazi */
  initScale();

  /* referans döngüsü */
  tIdx = 0;
  if (data.testimonials.length > 1){
    siteTimers.push(setInterval(() => showT((tIdx + 1) % data.testimonials.length), 6000));
  }
}

function animCount(el){
  const target = parseFloat(el.dataset.count);
  const suf = el.dataset.suffix || '';
  if (isNaN(target)){ el.textContent = el.dataset.count + suf; return; }
  const t0 = performance.now(), D = 1500;
  (function f(t){
    const p = Math.min(1, (t - t0) / D);
    const e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = Math.round(target * e).toLocaleString('tr-TR') + (suf ? `<sup>${esc(suf)}</sup>` : '');
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

function initScale(){
  const beam = $('#beam'), pL = $('#pL'), pR = $('#pR'), wrap = $('#scaleWrap');
  if (!beam) return;
  let cur = 0, mouse = 0, t = 0, alive = true;
  const coarse = matchMedia('(pointer:coarse)').matches;
  if (!coarse){
    wrap.addEventListener('mousemove', e => {
      const r = wrap.getBoundingClientRect();
      mouse = ((e.clientX - r.left) / r.width - .5) * 9;
    });
    wrap.addEventListener('mouseleave', () => mouse = 0);
  }
  (function loop(){
    if (!alive) return;
    t += 16;
    const idle = Math.sin(t / 2600) * (coarse ? 3 : 1.1);
    const tgt = mouse + idle;
    cur += (tgt - cur) * .06;
    beam.style.transform = `rotate(${cur}deg)`;
    pL.style.transform = `rotate(${-cur}deg)`;
    pR.style.transform = `rotate(${-cur}deg)`;
    siteTimers[0] = requestAnimationFrame(loop);
  })();
  siteTimers.push({ }); // yer tutucu; rAF iptali için alive flag'i
  siteTimers.push(() => {}); // temizlik uyumluluğu
  siteTimers.stop = () => { alive = false; };
}

/* görsel yükleme: tarayıcıda otomatik yeniden boyutlandırma (kota dostu) */
function pickImage(cb){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const M = 1400;
        let w = img.width, h = img.height;
        if (w > M){ h = Math.round(h * M / w); w = M; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(c.toDataURL('image/jpeg', .85));
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
function pickS(key){
  pickImage(url => { setS(key, url); refreshTab(); toast('Görsel yüklendi'); });
}

    ${litHead('testimonials', i, q, q.author)}
    <div class="field"><label>Alıntı</label><textarea rows="3" oninput="setL('testimonials','${q.id}','quote', this.value)">${esc(q.quote)}</textarea></div>
    <div class="grid2">
      <div class="field" style="margin:0"><label>Ad</label><input value="${esc(q.author)}" oninput="setL('testimonials','${q.id}','author', this.value)"></div>
      <div class="field" style="margin:0"><label>Unvan / Kurum</label><input value="${esc(q.role)}" oninput="setL('testimonials','${q.id}','role', this.value)"></div>
    </div>
  </div>`).join('')}`;
}

function tabMsgs(){
  const fmt = d => new Date(d).toLocaleString('tr-TR', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
  if (!data.messages.length) return `
    <div class="empty"><i data-lucide="inbox"></i>Henüz mesaj yok.<br>Sitedeki iletişim formundan gelen mesajlar burada listelenecek.</div>`;
  return data.messages.map(m => `
  <div class="msg ${m.read?'':'unread'}" id="msg-${m.id}">
    <div class="msg-row" onclick="openMsg('${m.id}')">
      <div><b>${esc(m.name)}</b><span class="msg-mail">${esc(m.email)}</span></div>
      <div class="msg-meta">${fmt(m.date)} ${m.read?'':'<span class="pill">Yeni</span>'}</div>
    </div>
    <p class="msg-sub">${esc(m.subject)}</p>
    <div class="msg-body">
      <p>${esc(m.message)}</p>
      <div class="msg-acts">
        <a class="abtn ghost" href="mailto:${esc(m.email)}?subject=Yanıt: ${esc(m.subject)}"><i data-lucide="send"></i>Yanıtla</a>
        ${m.read?'':`<button class="abtn ghost" onclick="markRead('${m.id}');event.stopPropagation()"><i data-lucide="check"></i>Okundu İşaretle</button>`}
        <button class="abtn ghost danger" onclick="delMsg('${m.id}');event.stopPropagation()"><i data-lucide="trash-2"></i>Sil</button>
      </div>
    </div>
  </div>`).join('');
}
function openMsg(id){
  const el = document.getElementById('msg-' + id);
  el.classList.toggle('open');
  const m = data.messages.find(x => x.id === id);
  if (m && !m.read){ m.read = true; persist(); el.classList.remove('unread'); el.querySelector('.pill')?.remove(); }
}
function markRead(id){
  const m = data.messages.find(x => x.id === id);
  if (m){ m.read = true; persist(); refreshTab(); }
}
function delMsg(id){
  confirmModal('Mesajı Sil', 'Bu mesaj kalıcı olarak silinecek.', 'Sil', () => {
    data.messages = data.messages.filter(x => x.id !== id);
    persist(); refreshTab(); toast('Mesaj silindi', 'trash-2');
  });
}
function resetAll(){
  confirmModal('Verileri Sıfırla', 'Tüm yazılar, fotoğraflar ve mesajlar fabrika ayarlarına dönecek. Bu işlem geri alınamaz.', 'Sıfırla', () => {
    localStorage.removeItem(STORE_KEY);
    data = JSON.parse(JSON.stringify(SEED));
    sessionStorage.removeItem('kd_adm');
    renderAdmin();
    toast('İçerik fabrika ayarlarına döndürüldü', 'rotate-ccw');
  });
}

/* --- giriş işlemleri --- */
function tryLogin(){
  const v = $('#pw').value;
  if (enc(v) === data.settings._pw){
    sessionStorage.setItem('kd_adm', '1');
    renderAdmin();
    toast('Hoş geldiniz', 'check');
  } else {
    const err = $('#loginErr');
    err.textContent = 'Şifre hatalı, tekrar deneyin.';
    err.classList.remove('shake'); void err.offsetWidth; err.classList.add('shake');
  }
}
function togglePw(){
  const inp = $('#pw');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  inp.parentElement.querySelector('button').innerHTML =
    `<i data-lucide="${show ? 'eye-off' : 'eye'}"></i>`;
  lucide.createIcons();
  inp.focus();
}

/* --- şifre kaydı: Genel sekmesindeki özel alan --- */
const _setS = setS;
setS = function(k, v){
  if (k === '_newpw'){ if (v) data.settings._pw = enc(v); saveSoon(); return; }
  if (k === '_pw') return; // doğrudan üzerine yazılmasın
  _setS(k, v);
};

/* ============================================================
   YÖNLENDİRME
   ============================================================ */
function route(){
  stopTimers();
  if (location.hash.startsWith('#/admin')) renderAdmin();
  else { renderSite(); window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', route);
/* panel başka sekmede güncellenirse siteyi canlı yenile */
window.addEventListener('storage', e => {
  if (e.key === STORE_KEY && !location.hash.startsWith('#/admin')){
    try { data = JSON.parse(e.newValue); } catch(err){}
    route();
  }
});
route();
</script>
</body>
</html>
