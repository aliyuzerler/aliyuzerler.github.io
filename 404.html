<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sayfa bulunamadı — Ali Yüzerler</title>
<meta name="robots" content="noindex"/>
<link rel="canonical" href="https://aliyuzerler.github.io/"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a130e;--fg:#eef4ee;--muted:#9db3a8;--brand:#00c38c;--gb:#0093b4;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12)}
@media (prefers-color-scheme:light){:root{--bg:#f6faf7;--fg:#0d1a14;--muted:#5b6f65;--card:rgba(13,26,20,.04);--line:rgba(13,26,20,.12)}}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:0}
body::before{width:520px;height:520px;background:radial-gradient(circle,rgba(0,195,140,.35),transparent 65%);top:-160px;right:-120px}
body::after{width:460px;height:460px;background:radial-gradient(circle,rgba(0,147,180,.28),transparent 65%);bottom:-140px;left:-120px}
.wrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2.5rem 1.25rem;max-width:640px;margin:0 auto}
.logo{position:fixed;top:22px;left:26px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;line-height:1.05;z-index:2}
.logo b{font-size:1.15rem;font-weight:800}
.logo span{font-size:.58rem;letter-spacing:.32em;color:var(--muted);font-weight:600}
.oval{position:relative;width:clamp(180px,42vw,250px);aspect-ratio:3/4;max-height:36vh;display:flex;align-items:center;justify-content:center;margin-bottom:2rem}
.oval::before{content:"";position:absolute;inset:0;border-radius:2.75rem;background:linear-gradient(135deg,var(--brand),var(--gb));opacity:.9}
.oval::after{content:"";position:absolute;inset:6px;border-radius:2.55rem;background:var(--bg)}
.oval .code{position:relative;z-index:1;font-size:clamp(3.2rem,10vw,4.6rem);font-weight:800;background:linear-gradient(135deg,var(--brand),var(--gb));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em}
h1{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:800;letter-spacing:-.01em;margin-bottom:.35rem}
.en{color:var(--muted);font-weight:600;margin-bottom:1rem}
.desc{color:var(--muted);font-size:.95rem;line-height:1.65;margin-bottom:2rem;max-width:26rem}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.btn-grad,.btn-ghost{display:inline-flex;align-items:center;gap:.5rem;height:48px;padding:0 1.5rem;border-radius:9999px;font-weight:700;font-size:.95rem;text-decoration:none;transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}
.btn-grad{background-image:linear-gradient(135deg,var(--brand),var(--gb));color:#fff;box-shadow:0 10px 30px -10px rgba(0,195,140,.55),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.btn-grad::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.3) 50%,transparent 68%);transform:translateX(-130%);transition:transform .75s ease;pointer-events:none}
.btn-grad:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-grad:hover::before{transform:translateX(130%)}
.btn-ghost{border:1px solid var(--line);color:var(--fg);background:var(--card)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.btn-grad:focus-visible,.btn-ghost:focus-visible,.logo:focus-visible,footer a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:9999px}
.hint{margin-top:1.4rem;color:var(--muted);font-size:.8rem}
footer{position:relative;z-index:1;text-align:center;padding:1.4rem;color:var(--muted);font-size:.8rem}
footer a{color:var(--muted)}
footer a:hover{color:var(--brand)}
@media (max-width:480px){.oval{margin-bottom:1.4rem}.desc{margin-bottom:1.5rem}}
</style>
</head>
<body>
<a class="logo" href="/"><b>Ali.</b><span>DEVELOPER</span></a>
<main class="wrap">
 <div class="oval" aria-hidden="true"><p class="code">404</p></div>
 <h1>Sayfa bulunamadı</h1>
 <p class="en">Page not found</p>
 <p class="desc">Aradığınız sayfa taşınmış, kaldırılmış ya da hiç var olmamış olabilir.<br/>The page you are looking for may have been moved, removed, or never existed.</p>
 <div class="actions">
  <a class="btn-grad" href="/">← Ana Sayfaya Dön</a>
  <a class="btn-ghost" href="/#projects">Projeleri Gör</a>
 </div>
 <p class="hint">Back to home · View projects</p>
</main>
<footer>© 2026 Ali Yüzerler · <a href="https://github.com/aliyuzerler">GitHub</a></footer>
</body>
</html>
